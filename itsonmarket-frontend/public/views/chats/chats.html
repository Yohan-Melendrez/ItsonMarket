<div class="main-content">
    <div class="container container-lg">
        <div class="chat-container">
            <!-- Sidebar de conversaciones -->
            <div class="chat-sidebar" id="chatSidebar">
                <div class="chat-sidebar-header">
                    <h2 style="margin: 0; font-size: 1.25rem;">Mensajes</h2>
                </div>

                <!-- Búsqueda -->
                <div style="padding: 0.75rem 1rem;">
                    <div class="search-bar">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                        <input type="text" id="buscarChat" placeholder="Buscar conversación..." class="search-input">
                    </div>
                </div>

                <!-- Lista de chats -->
                <div class="chat-list" id="chatList">
                    <!-- Loading -->
                    <div id="loadingChats" class="text-center" style="padding: 2rem;">
                        <div class="spinner"></div>
                        <p style="margin-top: 0.5rem; font-size: 0.875rem; color: var(--gray-500);">Cargando...</p>
                    </div>
                </div>
            </div>

            <!-- Área de mensajes -->
            <div class="chat-main" id="chatMain">
                <!-- Estado vacío (ningún chat seleccionado) -->
                <div id="chatVacio" class="chat-empty">
                    <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor" style="color: var(--gray-300);">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                            d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                    </svg>
                    <h3 style="margin: 1rem 0 0.5rem; color: var(--gray-600);">Tus mensajes</h3>
                    <p style="color: var(--gray-500); max-width: 280px;">
                        Selecciona una conversación de la lista para ver los mensajes.
                    </p>
                </div>

                <!-- Chat activo (oculto por defecto) -->
                <div id="chatActivo" class="hidden" style="display: flex; flex-direction: column; height: 100%;">
                    <!-- Header del chat -->
                    <div class="chat-header">
                        <button type="button" class="btn btn-icon mobile-only" id="btnVolverChats"
                            style="margin-right: 0.5rem;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none"
                                viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M15 19l-7-7 7-7" />
                            </svg>
                        </button>
                        <img id="chatUserAvatar" src="/imgs/default-avatar.svg" alt="" class="chat-header-avatar">
                        <div style="flex: 1;">
                            <h3 id="chatUserName" style="margin: 0; font-size: 1rem;"></h3>
                            <p id="chatUserStatus" style="margin: 0; font-size: 0.8rem; color: var(--gray-500);"></p>
                        </div>
                        <a id="chatVerPublicacion" href="#" class="btn btn-outline btn-sm" style="display: none;">
                            Ver publicación
                        </a>
                    </div>

                    <!-- Mensajes -->
                    <div class="chat-messages" id="chatMessages">
                        <!-- Los mensajes se cargan dinámicamente -->
                    </div>

                    <!-- Input de mensaje (solo texto) -->
                    <form class="chat-input-container" id="formMensaje">
                        <input type="text" id="inputMensaje" class="chat-input" placeholder="Escribe un mensaje..."
                            autocomplete="off">
                        <button type="submit" class="btn btn-primary btn-icon" id="btnEnviar" title="Enviar">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none"
                                viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                            </svg>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Template de item de chat en sidebar -->
<template id="chatItemTemplate">
    <div class="chat-item" data-chat-id="">
        <img src="/imgs/default-avatar.svg" alt="" class="chat-item-avatar">
        <div class="chat-item-content">
            <div class="chat-item-header">
                <span class="chat-item-name"></span>
                <span class="chat-item-time"></span>
            </div>
            <p class="chat-item-preview"></p>
        </div>
        <span class="chat-item-unread hidden">0</span>
    </div>
</template>

<!-- Template de mensaje -->
<template id="mensajeTemplate">
    <div class="chat-message">
        <div class="chat-message-content">
            <p class="chat-message-text"></p>
            <span class="chat-message-time"></span>
        </div>
    </div>
</template>
