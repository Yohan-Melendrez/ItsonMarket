<div class="main-content">
    <div class="container">
        <!-- Header -->
        <div class="page-header flex justify-between items-center flex-wrap gap-4">
            <div>
                <h1 class="page-title">Explorar Publicaciones</h1>
                <p class="page-subtitle">Encuentra productos y servicios de otros estudiantes</p>
            </div>
            <a href="#/publicaciones/crear" class="btn btn-primary">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
                Nueva Publicación
            </a>
        </div>

        <!-- Barra de búsqueda y filtros -->
        <div class="card mb-6" style="padding: 1.5rem;">
            <div class="flex flex-wrap gap-4 items-center">
                <div class="search-container" style="flex: 1; min-width: 250px;">
                    <svg xmlns="http://www.w3.org/2000/svg" class="search-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                    <input type="text" id="searchInput" class="search-input" placeholder="Buscar productos o servicios..." />
                </div>

                <select id="filterTipo" class="form-select" style="width: auto; min-width: 140px;">
                    <option value="">Todos</option>
                    <option value="producto">Productos</option>
                    <option value="servicio">Servicios</option>
                </select>

                <select id="filterOrden" class="form-select" style="width: auto; min-width: 160px;">
                    <option value="-fecha_publicacion">Más recientes</option>
                    <option value="fecha_publicacion">Más antiguos</option>
                    <option value="precio">Menor precio</option>
                    <option value="-precio">Mayor precio</option>
                    <option value="-vistas">Más vistos</option>
                </select>
            </div>
        </div>

        <!-- Grid de publicaciones -->
        <div id="publicaciones-container" class="grid grid-cols-1 sm-grid-cols-2 lg-grid-cols-3 gap-6">
            <!-- Las tarjetas se cargan dinámicamente -->
        </div>

        <!-- Estado vacío -->
        <div id="emptyState" class="empty-state hidden">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" />
            </svg>
            <h3>No hay publicaciones</h3>
            <p>Aún no hay publicaciones disponibles. ¡Sé el primero en publicar!</p>
            <a href="#/publicaciones/crear" class="btn btn-primary">
                Crear mi primera publicación
            </a>
        </div>

        <!-- Loading -->
        <div id="loadingState" class="text-center p-8">
            <div class="loader loader-lg"></div>
            <p class="mt-4 text-muted">Cargando publicaciones...</p>
        </div>

        <!-- Paginación -->
        <div id="pagination" class="pagination hidden">
            <!-- Se genera dinámicamente -->
        </div>
    </div>
</div>
