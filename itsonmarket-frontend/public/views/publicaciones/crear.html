<div class="main-content">
    <div class="container container-md">
        <!-- Header -->
        <div class="page-header">
            <a href="#/publicaciones" class="btn btn-ghost mb-4" style="margin-left: -8px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
                Volver
            </a>
            <h1 class="page-title">Crear Nueva Publicación</h1>
            <p class="page-subtitle">Completa los datos para publicar tu producto o servicio</p>
        </div>

        <!-- Formulario -->
        <div class="card" style="padding: 2rem;">
            <form id="createPublicacionForm" novalidate>
                
                <!-- Tipo de publicación -->
                <div class="form-group">
                    <label class="form-label required">¿Qué deseas publicar?</label>
                    <div class="flex gap-4 mt-2">
                        <label class="card" style="flex: 1; padding: 1.5rem; cursor: pointer; text-align: center; border: 2px solid var(--gray-200);" id="tipoProductoCard">
                            <input type="radio" name="tipo_publicacion" value="producto" id="tipoProducto" style="display: none;" checked />
                            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="margin: 0 auto 0.5rem; color: var(--gray-400);">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
                            </svg>
                            <span style="font-weight: 600; color: var(--gray-700);">Producto</span>
                            <p style="font-size: 0.8rem; color: var(--gray-500); margin: 0;">Artículos físicos</p>
                        </label>
                        <label class="card" style="flex: 1; padding: 1.5rem; cursor: pointer; text-align: center; border: 2px solid var(--gray-200);" id="tipoServicioCard">
                            <input type="radio" name="tipo_publicacion" value="servicio" id="tipoServicio" style="display: none;" />
                            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="margin: 0 auto 0.5rem; color: var(--gray-400);">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                            </svg>
                            <span style="font-weight: 600; color: var(--gray-700);">Servicio</span>
                            <p style="font-size: 0.8rem; color: var(--gray-500); margin: 0;">Tutorías, trabajos, etc.</p>
                        </label>
                    </div>
                </div>

                <!-- Título -->
                <div class="form-group">
                    <label for="titulo" class="form-label required">Título de la publicación</label>
                    <input type="text" id="titulo" class="form-input" placeholder="Ej: iPhone 12 Pro Max 256GB" maxlength="100" />
                    <p class="form-hint"><span id="tituloCount">0</span>/100 caracteres</p>
                    <p id="err-titulo" class="form-error"></p>
                </div>

                <!-- Descripción -->
                <div class="form-group">
                    <label for="descripcion" class="form-label required">Descripción</label>
                    <textarea id="descripcion" class="form-textarea" placeholder="Describe detalladamente tu producto o servicio..." maxlength="1000" rows="4"></textarea>
                    <p class="form-hint"><span id="descripcionCount">0</span>/1000 caracteres</p>
                    <p id="err-descripcion" class="form-error"></p>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <!-- Categoría -->
                    <div class="form-group">
                        <label for="categoria" class="form-label required">Categoría</label>
                        <select id="categoria" class="form-select">
                            <option value="">Selecciona una categoría</option>
                            <option value="Electrónica">Electrónica</option>
                            <option value="Libros">Libros y Material de Estudio</option>
                            <option value="Ropa">Ropa y Accesorios</option>
                            <option value="Muebles">Muebles y Hogar</option>
                            <option value="Transporte">Transporte</option>
                            <option value="Deportes">Deportes</option>
                            <option value="Tutorías">Tutorías</option>
                            <option value="Servicios">Servicios Profesionales</option>
                            <option value="Otros">Otros</option>
                        </select>
                        <p id="err-categoria" class="form-error"></p>
                    </div>

                    <!-- Precio -->
                    <div class="form-group">
                        <label for="precio" class="form-label required">Precio (MXN)</label>
                        <div style="position: relative;">
                            <span style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--gray-500);">$</span>
                            <input type="number" id="precio" class="form-input" placeholder="0.00" min="0" step="0.01" style="padding-left: 28px;" />
                        </div>
                        <p id="err-precio" class="form-error"></p>
                    </div>
                </div>

                <!-- Campos adicionales para productos -->
                <div id="camposProducto">
                    <div class="grid grid-cols-2 gap-4">
                        <div class="form-group">
                            <label for="marca" class="form-label">Marca (opcional)</label>
                            <input type="text" id="marca" class="form-input" placeholder="Ej: Apple, Samsung..." />
                        </div>
                        <div class="form-group">
                            <label for="edicion" class="form-label">Edición/Modelo (opcional)</label>
                            <input type="text" id="edicion" class="form-input" placeholder="Ej: 2024, Pro Max..." />
                        </div>
                    </div>
                </div>

                <!-- Campos adicionales para servicios -->
                <div id="camposServicio" class="hidden">
                    <div class="grid grid-cols-2 gap-4">
                        <div class="form-group">
                            <label for="modalidad" class="form-label">Modalidad</label>
                            <select id="modalidad" class="form-select">
                                <option value="">Selecciona</option>
                                <option value="presencial">Presencial</option>
                                <option value="en_linea">En línea</option>
                                <option value="hibrido">Híbrido</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="experiencia" class="form-label">Experiencia</label>
                            <input type="text" id="experiencia" class="form-input" placeholder="Ej: 2 años" />
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="form-group">
                            <label for="duracion" class="form-label">Duración por sesión</label>
                            <input type="text" id="duracion" class="form-input" placeholder="Ej: 1 hora" />
                        </div>
                        <div class="form-group">
                            <label for="unidad_tarifa" class="form-label">Precio por</label>
                            <select id="unidad_tarifa" class="form-select">
                                <option value="hora">Hora</option>
                                <option value="sesion">Sesión</option>
                                <option value="proyecto">Proyecto</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Imágenes -->
                <div class="form-group">
                    <label class="form-label">Imágenes (máx. 5)</label>
                    <div class="form-file-upload" id="dropAreaImages">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                        </svg>
                        <p class="form-file-upload-text">
                            <span>Haz clic para subir</span> o arrastra las imágenes
                        </p>
                        <p style="font-size: 0.8rem; color: var(--gray-400);">PNG, JPG hasta 5MB cada una</p>
                    </div>
                    <input type="file" id="imagenesInput" accept="image/*" multiple style="display: none;" />
                    <div id="imagenesPreview" class="flex gap-3 mt-4 flex-wrap"></div>
                </div>

                <!-- Botones -->
                <div class="flex gap-4 mt-8 justify-end">
                    <a href="#/publicaciones" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" id="btnPublicar" class="btn btn-primary btn-lg">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                        </svg>
                        <span id="btnPublicarText">Publicar</span>
                        <span id="btnPublicarLoader" class="loader hidden"></span>
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>
