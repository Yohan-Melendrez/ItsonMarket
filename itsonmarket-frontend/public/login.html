<section class="auth-page-itson">
    <div class="auth-card-itson">
        <!-- Logo ITSON Market -->
        <img src="/imgs/ItsonMarket.png" alt="ITSON Market" class="auth-logo-itson" />
        
        <!-- Subtítulo -->
        <h2 class="auth-subtitle-itson">PLATAFORMA DE COMPRA Y VENTA</h2>

        <div id="login-error" class="alert alert-error hidden mb-4"></div>

        <form id="loginForm" novalidate>
            <div class="form-group">
                <input 
                    type="text" 
                    id="itson_id" 
                    class="form-input-itson" 
                    placeholder="Ingresar ID ITSON de 11 dígitos"
                    maxlength="11"
                    inputmode="numeric"
                    autocomplete="username"
                />
                <p id="err-id" class="form-error hidden"></p>
            </div>

            <div class="form-group">
                <div style="position: relative;">
                    <input 
                        type="password" 
                        id="password" 
                        class="form-input-itson" 
                        placeholder="Contraseña"
                        autocomplete="current-password"
                    />
                    <button type="button" id="togglePassword" class="password-toggle-itson" onclick="togglePasswordVisibility('password', this)">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" id="eyeIcon">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>
                <p id="err-pass" class="form-error hidden"></p>
            </div>

            <button type="submit" id="btn-login" class="btn-itson-primary" disabled>
                <span id="btnLoginText">CONTINUAR</span>
                <span id="btnLoginLoader" class="loader hidden"></span>
            </button>
        </form>

        <a href="#/register" class="link-itson">
            ¿No tienes cuenta? Regístrate
        </a>

        <a href="#/publicaciones" class="link-itson-secondary">
            Explorar sin cuenta →
        </a>
    </div>
</section>
