<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ItsonMarket - Plataforma de Compra y Venta ITSON</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="icon" type="image/x-icon" href="/imgs/logo-itson.jpg">
</head>

<body>
    <!-- Navbar usando Web Component (Micro-Frontend) -->
    <nav class="navbar">
        <div class="navbar-container">
            <!-- Logo -->
            <a href="#/publicaciones" class="navbar-brand">
                <img src="/imgs/ItsonMarket.png" alt="ITSON Market" style="height: 45px; border-radius: 8px;">
            </a>
            
            <!-- Menú principal (visible cuando está logueado) -->
            <ul class="navbar-menu" id="nav-main-menu">
                <li>
                    <a href="#/publicaciones">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                        </svg>
                        Explorar
                    </a>
                </li>
                <li>
                    <a href="#/publicaciones/crear">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                        </svg>
                        Publicar
                    </a>
                </li>
                <li>
                    <a href="#/transacciones">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
                        </svg>
                        Transacciones
                    </a>
                </li>
                <li>
                    <a href="#/chats">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                        </svg>
                        Mensajes
                    </a>
                </li>
            </ul>
            
            <!-- Usuario autenticado -->
            <div class="navbar-user hidden" id="nav-user-menu">
                <div class="dropdown">
                    <div class="navbar-user-info" id="dropdown-trigger" onclick="toggleUserDropdown()">
                        <img src="/imgs/default-avatar.svg" alt="Avatar" class="navbar-avatar" id="user-avatar">
                        <span id="user-name">Usuario</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                        </svg>
                    </div>
                    
                    <div class="dropdown-menu hidden" id="user-dropdown">
                        <a href="#/perfil" class="dropdown-item">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                            </svg>
                            Mi Perfil
                        </a>
                        <a href="#/perfil/editar" class="dropdown-item">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            </svg>
                            Configuración
                        </a>
                        <div class="dropdown-divider"></div>
                        <button class="dropdown-item danger" onclick="handleLogout()">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                            </svg>
                            Cerrar Sesión
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- Links de autenticación (visible cuando NO está logueado) -->
            <div class="navbar-user" id="nav-auth-links">
                <a href="#/login" class="btn btn-ghost">Iniciar Sesión</a>
                <a href="#/register" class="btn btn-primary">Registrarse</a>
            </div>
            
            <!-- Botón menú móvil -->
            <button class="navbar-mobile-toggle" id="mobile-menu-toggle" onclick="toggleMobileMenu()">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
        </div>
        
        <!-- Menú móvil -->
        <div class="navbar-menu hidden" id="mobile-menu">
            <a href="#/publicaciones">Explorar</a>
            <a href="#/publicaciones/crear">Publicar</a>
            <a href="#/transacciones">Transacciones</a>
            <a href="#/chats">Mensajes</a>
            <a href="#/perfil">Mi Perfil</a>
        </div>
    </nav>

    <!-- App Container (donde se cargan las vistas) -->
    <main id="app"></main>
    
    <!-- Toast Container para notificaciones -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Scripts -->
    <!-- Web Components (Micro-Frontends) - Custom Elements para modularizar la UI -->
    <script src="/js/components.js"></script>
    <script src="/js/navbar.js"></script>
    <script src="/js/app.js"></script>

</body>

</html>
